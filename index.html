<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>my_portfolio</title>
</head>

<body>
<!--HEADER-->
    <header class="header" id="header">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">  <!-- Bibliotheque css pour nav__close et nav__tooggle -->

        <nav class="nav container">
            <a href="#" class="nav__logo">
                Tanou <span>Diallo</span>
            </a>
                <!-- Menu de navigation -->
            <div class="nav__menu" id="nav__menu">
                <ul class="nav __lis">
                    <li class="nav__item">
                        <a href="#Home" class="nav__link">Home</a>
                    </li>

                    <li class="nav__item">
                        <a href="#About" class="nav__link">About</a>
                    </li>

                    <li class="nav__item">
                        <a href="#Service" class="nav__link">Service</a>
                    </li>

                    <li class="nav__item">
                        <a href="#Project" class="nav__link">Project</a>
                    </li>

                    <li class="nav__item">
                        <a href="#Contact" class="nav__link">Contact</a>
                    </li>
                </ul>

                <!-- Boutton permettant de supprimer le menu de navigation -->
                <div class="nav__close" id="nav__close">
                    <i class="ri-close-line"></i>
                </div>
            </div>

            <!-- Boutton permettant de fermer ou ouvrir le menu de navigation -->
            <div class="nav__tooggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>
</body>
</html>
